services:
  webpulse:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: webpulse
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DB_PATH=/app/data/webpulse.json
    volumes:
      - webpulse-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  webpulse-data:
    driver: local
